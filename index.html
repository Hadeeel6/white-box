function bModel(F){let east=5,acc=74;
  if(!F.zip)east+=F.commute?2:8;
  if(!F.school){east+=3;acc-=3}
  if(!F.sports){east+=2;acc-=2}
  if(!F.zip)acc-=1; if(!F.commute)acc-=1;
  if(F.care){east+=3;acc+=3}
  if(!F.work){east-=1;acc-=8}
  if(!F.essay){east-=2;acc-=9}
  east=Math.max(1,east);
  const ratio=Math.round(((east/133)/((60-east)/267))*100)/100;
  let mal=64,ana=69;if(!F.zip){mal+=F.commute?3:8;ana+=F.commute?3:8}if(!F.school)mal+=3;if(!F.sports)mal+=2;if(F.care){mal+=6;ana+=5}if(!F.essay){mal-=4;ana-=6}if(!F.work)mal-=3;
  const proxy=!F.zip&&F.commute;
  return{east,acc,ratio,mal,ana,proxy,win:ratio>=0.8&&acc>=70}}
function meter(label,val,goal,max,fmt,ok){const p=Math.max(0,Math.min(100,val/max*100));return `<div class="stack" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:700">${label}</span><strong class="mono" style="font-size:22px;color:${ok?'var(--green-ink)':'var(--ink)'}">${fmt(val)}</strong></div><div class="gauge ${ok?'ok':''}"><i style="width:${p}%"></i><b style="left:${goal/max*100}%"></b></div><span class="muted" style="font-size:12px">Goal: ${fmt(goal)} or higher</span></div>`}

  const past=R.pick.map((p,i)=>{const M=RS_MOMENTS[i];const o=M.opts[p];const fresh=i===step-1;return `<section class="card stack r3m ${fresh?'fade-in':''}" ${fresh?'id="r3last"':''}>
    <span class="r3when">${M.when}</span><div class="r3you">You: <strong>${o.t}</strong></div>
    <p class="r3res">${o.r}</p>
    <div class="r3why ${o.s===2?'g':o.s===1?'a':'r'}"><span class="r3tag">${o.s===2?'Strong move':o.s===1?'Helps, but…':'This backfired'}</span><strong>${o.idea}</strong><span>${o.why}</span></div>
    ${fresh&&o.s<2&&!R.done?`<div><button class="linkbtn" data-act="r3Redo">Try this moment again</button></div>`:''}</section>`}).join('');
  let now='';
  if(step<3){const M=RS_MOMENTS[step];now=`<section class="card stack r3m" style="gap:14px">
    <span class="r3when">${M.when}</span>
    <div class="r3msg">${FIGS[M.who].replace('class="fig"','class="fig" width="40" height="40" style="width:40px;height:40px;flex-basis:40px"')}<div class="bubble-them">${esc(M.msg)}</div></div>
    <strong style="font-size:19px">${M.q}</strong>
    <div class="r3opts">${M.opts.map((o,i)=>`<button class="r3opt" data-act="r3Pick" data-arg="${i}">${o.t}</button>`).join('')}</div></section>`}
  let end='';
  if(step===3){const used=new Set(R.pick.flatMap((p,i)=>RS_MOMENTS[i].opts[p].sh));const best=total>=6,ok=total>=4;
    end=`<section class="card stack fade-in r3end" id="r3end">
      <span class="kicker" style="color:var(--blue)">One week later</span>
      <div class="r3msg">${FIGS.jordan.replace('class="fig"','class="fig" width="48" height="48" style="width:48px;height:48px;flex-basis:48px"')}<div class="bubble-them" style="font-size:16px">${best?'the video’s gone. people at school actually came up to me and said sorry. thank you for asking me first, that meant a lot.':ok?'it’s mostly calmed down. some people still bring it up. thanks for sticking with me.':'some people still think i did it. i wish we’d gotten help sooner.'}</div></div>
      <p style="font-size:16px">${best?'You protected Jordan, slowed the spread and got the right people involved.':ok?'You helped, but some of your moves cost Jordan time or trust. Look at the moments marked “Helps, but…”.':'A few moves backfired. That’s normal the first time. These situations move fast and the obvious move is often wrong.'} <span class="muted">${total} of 6 points</span></p>
      ${!best&&!R.done?`<div><button class="btn btn-ghost" data-act="r3Restart">Replay the 3 moments</button></div>`:''}
    </section>
    <section class="card stack fade-in shield">
      <div class="stack" style="gap:4px"><span class="kicker">Keep this</span><h2 style="font-size:22px">Your SHIELD card</h2><span class="muted" style="font-size:14px">What to do if a fake of someone you know shows up. The steps you took are checked.</span></div>
      <div class="shgrid">${SHIELD.map(x=>`<div class="sh ${used.has(x[0])?'on':''}"><b>${x[0]}</b><div><strong>${x[1]}</strong><span>${x[2]}</span></div>${used.has(x[0])?'<i aria-label="You did this">✓</i>':''}</div>`).join('')}</div>
      <span class="muted" style="font-size:12.5px">SHIELD is a roadmap shared by Laura Tierney of The Social Institute (AP, 2026). In the U.S., the TAKE IT DOWN Act requires platforms to remove fake intimate images within 48 hours of a report.</span>
    </section>
    <section class="card stack fade-in" style="gap:10px">
      <label for="dreason" style="font-weight:700;font-size:18px">Last step: if this happened to you or a friend, who would your trusted adult be, and why them?</label>
      <textarea id="dreason" rows="2" data-input="x:d6:reason" placeholder="I would go to … because …" ${D.reasonDone?'readonly':''}>${esc(D.reason||'')}</textarea>
      <span class="muted" style="font-size:13px">Only you see this. A name or a role (coach, aunt, counselor) is fine.</span>
      <div style="display:flex;justify-content:flex-end;gap:12px;align-items:center">${D.reasonDone?'<span style="color:var(--green-ink);font-weight:600">Saved · +20 XP</span>':`${D.warn?'<span class="xwarn" style="color:var(--amber-ink);font-weight:600;font-size:14px">Write a few words first.</span>':''}<button class="btn btn-primary" data-act="dSubmit">Finish the case</button>`}</div>
    </section>
    ${D.reasonDone?caseDoneCard('c6'):''}`}
  return topbar()+`<main class="wrap">${convoHTML(S.d6d,D_CONVO)}${head}${past}${now}${end}</main>`}
ACT.r3Pick=i=>{const R=S.d6.r3;if(R.pick.length>=3)return;R.pick.push(+i);const o=RS_MOMENTS[R.pick.length-1].opts[+i];if(o.s===2)S.cred+=5;render();setTimeout(()=>{const el=document.getElementById(R.pick.length===3?'r3end':'r3last');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},60)};
ACT.r3Redo=()=>{const R=S.d6.r3;R.pick.pop();render()};
ACT.r3Restart=()=>{const R=S.d6.r3;R.pick=[];render();const el=document.querySelector('.r3');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
ACT.dSubmit=()=>{const D=S.d6;const el=document.getElementById('dreason');if(el)D.reason=el.value;if((D.reason||'').trim().length<3){D.warn=true;render();return}D.warn=false;D.reasonDone=true;D.r3.done=true;S.cred+=20;markCase('c6');render()};


const VIEWS={home,values,value,guide,settings,mission,lessons,cases:casesLib,reflect,journey,l1,l2,l3,intro,brief,chat,verify,decide,studio,passport,b_intro,b_brief,b_test,b_decide,b_fix,d_intro,d_brief,d_chat,d_check,d_respond};
function render(){
  const ae=document.activeElement;const id=ae&&ae.id;let s0,s1;
  if(id&&ae.selectionStart!=null){s0=ae.selectionStart;s1=ae.selectionEnd}
  const isCase=CASE_ORDER.some(k=>CASES[k].screens.includes(S.screen));
  const inner=(VIEWS[S.screen]||home)()+(isCase&&!INTROS.includes(S.screen)?'<p class="fict"><span aria-hidden="true">ⓘ</span> '+CASES[caseOf(S.screen)].foot+'</p>':'');
  const _seen=new Set([...document.querySelectorAll('.fade-in')].map(e=>e.textContent));
  app.innerHTML=shell(inner)+(S.toast&&!S.modal?`<div class="toast" role="status">${esc(S.toast)}</div>`:'')+modalHTML();document.title=pageTitle()+' · White Box';sentenceLabels();document.querySelectorAll('.fade-in').forEach(e=>{if(_seen.has(e.textContent))e.classList.remove('fade-in')});document.body.classList.toggle('modal-open',!!S.modal);
  if(S.toast){const t=S.toast;setTimeout(()=>{if(S.toast===t){S.toast=null;const el=document.querySelector('.toast');if(el)el.remove()}},2800)}
  if(S.screen==='chat'){const el=document.getElementById('chatlog');if(el)el.scrollTop=el.scrollHeight}
  document.querySelectorAll('.ailog').forEach(el=>{el.scrollTop=el.scrollHeight});
  if(S.screen==='d_chat'){const el=document.getElementById('gcbody');if(el)el.scrollTop=el.scrollHeight}
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(s0!=null&&el.setSelectionRange){try{el.setSelectionRange(s0,s1)}catch(e){}}}}
  if(S.modal){const b=document.querySelector('.modal .btn-primary');if(b)b.focus({preventScroll:true})}
  const ms=document.getElementById('mapscroll');if(ms&&ms.scrollWidth>ms.clientWidth){const h=ms.querySelector('.here .pin,.mnode.here');if(h){const r=h.getBoundingClientRect(),R=ms.getBoundingClientRect();ms.scrollLeft+=r.left-R.left-R.width/2+r.width/2}}
  saveState();
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg)}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='name'){const v=e.target.querySelector('#nm').value.trim();if(v){S.name=v.slice(0,24);S.toast='Name saved';render()}else{const i=e.target.querySelector('#nm');i.focus();i.setAttribute('aria-invalid','true')}return}
  if(f==='chat')onChatSubmit(e.target);
  else if(f==='bsearch'){const q=e.target.querySelector('#bq').value.trim();if(q)openPage('search:'+q)}
  else if(f==='ai'){const id=e.target.dataset.id;const inp=e.target.querySelector('input');const t=inp.value.trim();if(t){inp.value='';if(AI_CFG[id].chips.includes(t))aiAsk(id,t);else liveAskTool(id,t)}}
  else if(f==='cown'){const inp=e.target.querySelector('#cown');const t=inp.value.trim();if(!t)return;inp.value='';liveAskPerson(curConvo(),LIVE_CTX.convo,t)}
  else if(f==='own'){const inp=e.target.querySelector('#own');const t=inp.value.trim();if(!t)return;inp.value='';liveAskPerson(S.d,LIVE_CTX.decide,t)}
});
app.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k==='nwT'||k==='l3t')render()});
app.addEventListener('scroll',e=>{if(e.target&&e.target.id==='prompt')syncBack()},true);
app.addEventListener('input',e=>{const k=e.target.dataset.input;if(!k)return;
  if(k.startsWith('v:')){const [,vk,f]=k.split(':');(S.vdraft[vk]=S.vdraft[vk]||{me:'',ai:''})[f]=e.target.value;saveState();return}
  if(k.startsWith('r:')){const [,n,f]=k.split(':');S.rf[n][f]=e.target.value;saveState();return}
  if(k==='nwT'){const L=LS('l1');L.T=parseFloat(e.target.value);L.Tmoved=true;const P=nwProbs(NW[L.set],L.T);document.querySelectorAll('.nwb').forEach((el,i)=>{el.querySelector('i').style.width=(P[i]*100).toFixed(1)+'%';el.querySelector('b').textContent=Math.round(P[i]*100)+'%'});const lb=e.target.closest('.tslide').querySelector('b');if(lb)lb.textContent=L.T.toFixed(1);return}
  if(k==='l3t'){const L=LS('l3');L.t=parseInt(e.target.value)/10;const fb=document.querySelector('.facebox');if(fb)fb.innerHTML=sceneSVG(L.o,L.t,L.seed,280);const lb=e.target.closest('.tslide').querySelector('b');if(lb)lb.textContent=Math.round(L.t*10)+' / 10';document.querySelectorAll('.stepdots i').forEach((d,i)=>d.classList.toggle('on',i<=Math.round(L.t*10)));return}
  if(k.startsWith('x:')){const [,o,f]=k.split(':');S[o][f]=e.target.value;if((S[o].warn||S[o].ruleWarn)&&e.target.value.trim().length>=(f==='rule'?5:10)){S[o].warn=false;S[o].ruleWarn=false;document.querySelectorAll('.xwarn').forEach(w=>w.remove())}return}
  if(k==='prompt'){S.p.text=e.target.value;const box=document.getElementById('ings');if(box)box.innerHTML=ingredientsHTML();syncBack()}
  else if(k==='reason'){S.d.reason=e.target.value;if(S.d.warn&&S.d.reason.trim().length>=10){S.d.warn=false;const w=document.getElementById('rwarn');if(w)w.remove()}}
  else if(k==='rule'){S.p.rule=e.target.value;S.p.saved=false;if(S.p.ruleWarn&&S.p.rule.trim().length>=5){S.p.ruleWarn=false;const w=document.getElementById('rulewarn');if(w)w.remove()}}
});
function fromHash(){const h=decodeURIComponent((location.hash||'').replace('#',''))||'home';const [sc,p]=h.split('/');applyRoute(sc,p)}
window.addEventListener('hashchange',()=>{fromHash();render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]:not(button)')){e.preventDefault();const f=ACT[e.target.dataset.act];if(f)f(e.target.dataset.arg)}
  if(e.key==='Tab'&&S.modal){const f=[...document.querySelectorAll('.modal button')];if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
});
const FRESH_ALL=JSON.stringify(S,(k,v)=>k==='tm'?undefined:v);const FRESH4=JSON.stringify({c:S.c,v:S.v,d:S.d,p:S.p,vote:S.vote});CASES.c4.reset=()=>{Object.assign(S,JSON.parse(FRESH4))};
