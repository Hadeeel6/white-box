<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White Box · Values-guided AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Playfair+Display:wght@700;900&display=swap">
<style>
:root{
  --display:'Bricolage Grotesque','Inter',sans-serif;
  --ink:#1C1E22;--ink2:#41454F;--mute:#646A78;--line:#E6E2D8;--line2:#D2CCBF;--bg:#F6F4EE;--card:#FFFFFF;
  --blue:#3355E0;--blue-d:#2440B8;--blue-ink:#1D2F80;--blue-t:#EDF1FE;--blue-t2:#DFE6FD;--blue-b:#C3CEF8;
  --green:#1E9E6A;--green-ink:#11573B;--green-t:#DDF5EA;--green-t2:#F0FAF5;
  --amber:#D9822B;--amber-ink:#7A3E00;--amber-t:#FFEFD6;--amber-t2:#FFF7EC;--amber-b:#F5D3A6;
  --red:#E0484F;--red-ink:#8A1C22;--red-t:#FDE3E4;--red-t2:#FEF2F2;
  --sun:#FFC845;--tang:#FF8A3D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display),sans-serif;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:'Lexend',system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:1060px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:'Lexend',system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--blue)}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn:disabled{background:#EEF0F4;color:var(--mute);border-color:#EEF0F4;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.topbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display),sans-serif;font-weight:700;font-size:18px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font-size:13px;padding:6px 12px;border-radius:999px;background:#EEF0F4;color:var(--mute);border:none}
.step.done{background:var(--blue-t2);color:var(--blue-ink)}
.step.now{background:var(--blue);color:#fff;font-weight:600}
.rank{font-family:'Lexend',system-ui,sans-serif;font-size:13px;color:#8A4B00;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink2)}
.back:hover{background:var(--bg)}
.prog{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 1 280px}
.prog-label{font-size:13px;color:var(--mute)}.prog-label strong{color:var(--ink)}
.prog-track{display:flex;gap:4px;width:100%}
.prog-track span{flex:1;height:4px;border-radius:2px;background:#E3E6EC}
.prog-track span.done{background:var(--blue-b)}
.prog-track span.now{background:var(--blue)}
.phase{font-size:14px;color:var(--mute)}.phase.now{color:var(--blue);font-weight:700}.phase.done{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bar{height:10px;background:#EEF0F4;border-radius:999px}
.bar>span{display:block;height:10px;border-radius:999px}
.coach{display:flex;gap:12px;align-items:center;background:var(--amber-t2);border:1px solid var(--amber-b);border-radius:14px;padding:12px 16px}
.avatar{flex:0 0 36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.col{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.col.on{border:2px solid var(--blue)}
.col.off{border:1px solid var(--line);opacity:.55}
.tok{font:inherit;font-size:17px;line-height:1.7;padding:0 3px;border-radius:5px;border:none;background:transparent;color:var(--ink)}
.tok.flag{background:#FDE68A}
.tok.miss{outline:2px dashed var(--amber);outline-offset:1px}
.slot{border:2px dashed var(--line2);border-radius:10px;padding:10px;font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:2px;text-align:center;min-height:44px;justify-content:center}
.slot.good{border:2px solid var(--green);background:var(--green-t2);color:var(--green-ink)}
.slot.bad{border:2px solid var(--red);background:var(--red-t2);color:var(--red-ink)}
.slot.warn{border:2px solid var(--amber);background:var(--amber-t2);color:var(--amber-ink)}
.bubble-them{align-self:flex-start;max-width:80%;background:var(--bg);border-radius:4px 14px 14px 14px;padding:10px 14px}
.bubble-me{align-self:flex-end;max-width:75%;background:var(--blue);color:#fff;border-radius:14px 4px 14px 14px;padding:10px 14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:12px;background:#fff;border:1px solid var(--line2);text-align:left}
.opt.on{background:var(--blue-t);border:2px solid var(--blue)}
textarea,input[type=text]{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input[type=text]{min-height:48px;padding:0 14px}
@media (max-width:720px){.wrap{padding:18px 16px 40px}.topbar{padding:12px 16px}.hide-sm{display:none}}

.fade-in{animation:fadeUp .35s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}}
.paper{position:relative;background:#FFFEFB;border:1px solid #E7E1D6;border-radius:6px;padding:22px 22px 26px;box-shadow:0 14px 30px rgba(22,24,29,.10);display:flex;flex-direction:column;gap:12px;transform:rotate(-1deg)}
.paper .mast{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;text-align:center;line-height:1}
.paper .rule{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:3px}
.ln{height:8px;border-radius:4px;background:#ECE8DF}
.sticky{position:absolute;right:-18px;bottom:-22px;background:#FDE68A;padding:12px 14px;border-radius:3px;box-shadow:0 6px 14px rgba(90,74,51,.2);transform:rotate(4deg);font-size:14px;line-height:1.35;max-width:150px}
.stamp{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-12deg);border:4px solid #C0261A;color:#C0261A;font-family:var(--display),sans-serif;font-weight:700;font-size:34px;letter-spacing:.08em;padding:6px 18px;border-radius:8px;background:rgba(255,254,251,.85);animation:stampIn .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{from{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1.8)}to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.cast{display:flex;gap:10px;align-items:flex-start;flex:1 1 160px}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
@media (max-width:600px){.sticky{right:8px;bottom:-18px}}
.cast{opacity:0;animation:castIn .5s cubic-bezier(.2,.9,.3,1.2) forwards}
.cast:nth-child(1){animation-delay:.15s}.cast:nth-child(2){animation-delay:.45s}.cast:nth-child(3){animation-delay:.75s}
@keyframes castIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.av{position:relative;flex:0 0 40px;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:transform .2s}
.cast:hover .av{transform:translateY(-3px) rotate(-4deg)}
.av-you{animation:wave 1.2s ease-in-out 1s 1}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
.av-nova::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--blue);opacity:0;animation:ring 2.4s ease-out 1.2s infinite}
@keyframes ring{0%{opacity:.6;transform:scale(.9)}70%,100%{opacity:0;transform:scale(1.25)}}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.3;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.say{display:inline-block;margin-top:4px;background:var(--amber-t);color:var(--amber-ink);font-size:13px;font-weight:600;padding:4px 10px;border-radius:10px 10px 10px 2px;opacity:0;transform-origin:left bottom;animation:pop .35s cubic-bezier(.2,1.4,.4,1) 1.4s forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.cast.seen,.cast.seen .say{animation:none;opacity:1}
@media (prefers-reduced-motion:reduce){.cast,.say{animation:none;opacity:1}.av-you,.av-nova::after,.dots i{animation:none}.cast:hover .av{transform:none}}
.fig{width:96px;height:96px;flex:0 0 96px;display:block}
.fig .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.cast:nth-child(2) .fig .bob{animation-delay:.6s}.cast:nth-child(3) .fig .bob{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.fig .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fig .ant{animation:antenna 1.6s ease-in-out infinite}
@keyframes antenna{0%,100%{opacity:.4}50%{opacity:1}}
.fig .steam{animation:steam 2.4s ease-in-out infinite;opacity:0}
.fig .steam.s2{animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-5px)}}
.fig .lens{animation:scan 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 80%}
@keyframes scan{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.cast{flex-direction:column;align-items:flex-start;gap:8px}
@media (prefers-reduced-motion:reduce){.fig .bob,.fig .eye,.fig .ant,.fig .steam,.fig .lens{animation:none}.fig .steam{opacity:.6}}
.browser{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(22,24,29,.06)}
.br-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#F1F3F6;border-bottom:1px solid var(--line)}
.br-dots{display:flex;gap:6px;margin-right:4px}.br-dots i{width:11px;height:11px;border-radius:50%;background:#D5D9E0}
.br-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:var(--ink2)}
.br-btn:hover:not(:disabled){background:#E3E6EC}.br-btn:disabled{opacity:.35;cursor:default}
.br-url{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-bms{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:#FAFBFC}
.bm{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.bm.on{border-color:var(--blue);background:var(--blue-t)}.bm:hover{background:var(--bg)}
.br-view{height:560px;overflow-y:auto;background:#fff}
.pg-pad{padding:22px 26px}
.plink{all:unset;cursor:pointer;color:#1A0DAB;text-decoration:underline}.plink:focus-visible{outline:3px solid var(--blue)}
.pg-home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.pg-search{display:flex;gap:8px;width:100%;max-width:520px}
.pg-wiki{font-family:Georgia,'Times New Roman',serif;color:#202122}.pg-wiki p{font-size:16px;line-height:1.65;margin:10px 0}
.wk-top{display:flex;gap:12px;align-items:baseline;padding:10px 26px;border-bottom:1px solid #C8CCD1;background:#F8F9FA;font-family:'Lexend',sans-serif;font-size:13px;color:#54595D}
.wk-tabs{display:flex;gap:16px;font-family:'Lexend',sans-serif;font-size:14px;margin:6px 0 14px}.wk-tabs .on{font-weight:600;border-bottom:2px solid #202122}
.wk-box{float:right;width:210px;margin:0 0 12px 18px;border:1px solid #A2A9B1;background:#F8F9FA;padding:10px;font-family:'Lexend',sans-serif;font-size:13px;display:flex;flex-direction:column;gap:6px;text-align:center}
.wk-box table{text-align:left;font-size:13px;border-collapse:collapse}.wk-box td{padding:2px 4px;vertical-align:top}.wk-box td:first-child{font-weight:600}

.wk-hist{width:100%;border-collapse:collapse;font-family:'Lexend',sans-serif;font-size:14px}.wk-hist th,.wk-hist td{border:1px solid #EAECF0;padding:8px 10px;text-align:left;vertical-align:top}.wk-hist th{background:#F8F9FA}.wk-hist tr.hl td{background:#FFF7E8}
.pg-qh{background:#FFFBF5}.qh-top{display:flex;gap:12px;align-items:baseline;padding:12px 26px;background:#7C3AED;color:#fff;font-size:13px}.qh-top strong{font-size:17px}
.qh-card{background:#fff;border-radius:14px;padding:26px;font-family:Georgia,serif;font-style:italic;font-size:26px;line-height:1.3;box-shadow:0 6px 18px rgba(124,58,237,.12)}
.qh-ad{height:120px;border:1px dashed #D8D0C4;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#9A8F7E;font-size:12px}
.pg-gz{background:#EDE8DC}.gz-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.gz-paper{background:#F6F1E4;border:1px solid #D9CFB8;padding:20px 22px;font-family:Georgia,serif;color:#2B2620;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.gz-mast{font-family:'Playfair Display',serif;font-weight:900;font-size:34px;text-align:center}
.gz-date{display:flex;justify-content:space-between;border-top:2px solid #2B2620;border-bottom:1px solid #2B2620;padding:3px 0;margin:6px 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.gz-h{font-family:Georgia,serif;font-size:22px;margin:10px 0 6px}
.gz-cols{columns:2;column-gap:20px;font-size:14px;line-height:1.55}.gz-cols p{margin:0 0 8px}
.pg-err{height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:40px 48px;background:#fff}

.gov-t{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}.gov-t th,.gov-t td{border-bottom:1px solid #E5E7EB;padding:9px 10px;text-align:left}.gov-t th{background:#F3F5F8;font-size:13px}.gov-t tr.hl td{background:#FFFBEA}

@media (max-width:700px){.gz-cols{columns:1}.wk-box{float:none;width:auto;margin:0 0 12px}.pg-qh .pg-pad{grid-template-columns:1fr!important}}
.rail{flex:1 1 230px;max-width:260px;display:flex;flex-direction:column;gap:8px}
.rail-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink2);text-transform:uppercase}
.src{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.src:hover{border-color:var(--line2)}.src:focus-visible{outline:3px solid var(--blue)}

.tok{font-size:inherit;line-height:1.6}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:18px;height:14px;border-radius:4px;font-style:normal;font-size:10px}
.lg-flag{background:#FDE68A}.lg-miss{outline:2px dashed var(--amber);outline-offset:-2px}.lg-star{background:var(--blue-t2);color:var(--blue-ink)}
del{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red);color:#9AA1AE}
del .tok{color:#9AA1AE!important;background:transparent!important;text-decoration:line-through;text-decoration-color:var(--red)}
ins{text-decoration:none;background:var(--green-t);color:var(--green-ink);font-weight:700;padding:0 4px;border-radius:5px}
/* fact tracker + proof states */
.trk{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.trk-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;font-size:15px;color:var(--ink)}
.trk-row.cur{background:var(--blue-t);border-color:var(--blue-b)}
.trk-dot{flex:0 0 24px;width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--ink2)}
.trk-row.cur .trk-dot{background:var(--blue);color:#fff}
.trk-row.ok .trk-dot{background:var(--green-t);color:var(--green-ink)}
.trk-row.need .trk-dot,.missing .trk-dot{background:var(--amber);color:#fff}
.trk-row.bad .trk-dot{background:var(--red-t,#FDE8E8);color:var(--red-ink)}
.trk-t{flex:1;font-weight:600}.trk-s{font-size:12px;color:var(--mute)}
.trk-row.need .trk-s{color:var(--amber-ink);font-weight:600}.trk-row.ok .trk-s{color:var(--green-ink)}.trk-row.bad .trk-s{color:var(--red-ink)}
.missing{border:2px dashed var(--amber);border-radius:12px;padding:12px 14px;background:var(--amber-t2);color:#3F2A0A}
.dbadge{display:inline-flex;align-items:center;gap:4px;margin:0 4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;vertical-align:2px;line-height:1.6;border:0}
.dbadge.ok{background:var(--green-t);color:var(--green-ink)}
.dbadge.need{background:#fff;color:var(--amber-ink);border:1.5px dashed var(--amber);cursor:pointer}
.dbadge.bad{background:var(--amber-t);color:var(--amber-ink)}
.dbadge.anim{animation:insIn .5s .5s ease-out both}
.chip .dot{width:8px;height:8px;border-radius:999px;background:var(--blue);display:inline-block;margin-right:6px}
.chip.pulse{border-color:var(--blue-b);color:var(--blue-d);animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.35)}100%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
@media (prefers-reduced-motion:reduce){.chip.pulse{animation:none}}
.fict{max-width:1240px;margin:4px auto 28px;padding:0 24px;font-size:13px;color:var(--mute);text-align:center}
.ing-role{--ic:#6D28D9;--ib:#F1EAFF}.ing-context{--ic:#0F766E;--ib:#DDF4EF}.ing-task{--ic:#1D4ED8;--ib:#E6EEFF}.ing-rules{--ic:#C2410C;--ib:#FFEBDD}.ing-format{--ic:#BE185D;--ib:#FCE7F1}
.ing-h{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-bottom:2px}
.ingr{display:flex;align-items:center;gap:10px;min-height:38px}
.ing-dot{flex:0 0 22px;width:22px;height:22px;border-radius:999px;border:2px solid var(--ic);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.ingr.on .ing-dot{background:var(--ic)}
.ingr-t{flex:1;font-size:15px}.ingr-t span{color:var(--mute)}.ingr.on .ingr-t strong{color:var(--ic)}
.addb{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.addb:hover{border-color:var(--blue-b);color:var(--blue-d)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px 32px}
.rchip{min-height:30px;padding:0 10px;border-radius:999px;border:1px dashed #0F766E;background:#fff;color:#0F766E;font-size:13px;font-weight:600;cursor:pointer}
.rchip.used{border-style:solid;background:#DDF4EF;cursor:default}
.blank-hint{font-size:13px;color:var(--amber-ink);font-weight:600;padding-top:4px}
.npaper{background:#FFFDF8;border:1px solid #ECE6D8;border-radius:8px;padding:26px 30px;box-shadow:0 1px 0 #ECE6D8,0 8px 20px -14px rgba(60,40,0,.25)}
.d-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:24px;line-height:1.2;margin-bottom:10px}
.d-title{margin:0 0 12px}
.d-body{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.85;color:#262626;max-width:62ch}
.npaper mark.chg{background:var(--ib);color:inherit;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;animation:hlIn .9s ease-out both}
@keyframes hlIn{from{background:transparent}to{background:var(--ib)}}
.ntag.pop{animation:insIn .5s .3s ease-out both}
.chglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chglist li{display:flex;gap:10px;align-items:center;font-size:15px}
.chglist li .pill{min-width:72px;justify-content:center}
.chglist s{color:var(--mute)}
.pill.warnp{background:var(--amber-t);color:var(--amber-ink);min-width:72px;justify-content:center}
.chglist li.back{color:var(--amber-ink)}
@media (prefers-reduced-motion:reduce){.npaper mark.chg{animation:none}}
.npaper .hl{background:var(--ib);box-shadow:inset 0 -2px 0 var(--ic);border-radius:3px;padding:0 2px}
.npaper ins{background:var(--ib);color:inherit;font-weight:inherit;box-shadow:inset 0 -2px 0 var(--ic);border-radius:3px;padding:0 2px;animation:insIn .5s .3s ease-out both}
.npaper del{color:#A3A3A3}
.ntag{font-family:'Lexend',system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--ic);border:1.5px dashed var(--ic);border-radius:999px;padding:0 7px;vertical-align:2px;white-space:nowrap}
.nnote{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:10px 14px;border-radius:4px 12px 12px 12px;background:var(--bg);color:var(--ink);border-left:3px solid #C2410C}
.added{font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--ib);color:var(--ic);font-weight:700;font-size:13px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.ck-dot{flex:0 0 22px;width:22px;height:22px;border-radius:999px;border:2px solid var(--line2,#CBD2DC);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.ck.ok{background:var(--green-t2)}.ck.ok .ck-dot{background:var(--green);border-color:var(--green)}.ck.ok strong{color:var(--green-ink)}
.approve{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--green-t2);border:1px solid var(--green-b,#BFE3CD);color:var(--green-ink);font-size:15px}
.again{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px dashed var(--line2,#CBD2DC);border-radius:14px;background:#fff}
.again-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.again-row{display:flex;flex-direction:column;gap:6px}
.again-card{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.again-card .diff{color:var(--amber-ink);font-weight:700}.again-card .same{color:var(--ink2)}
.again-v{font-weight:700;font-size:14px;color:var(--amber-ink)}.again-v.ok{color:var(--green-ink)}
.pwrap{position:relative}
.pback,.pwrap textarea{font:inherit;font-size:16px;line-height:1.6;padding:12px 14px;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:normal}
.pback{position:absolute;inset:0;border:1px solid transparent;border-radius:10px;color:transparent;overflow:hidden;pointer-events:none;background:#fff}
.pwrap textarea{position:relative;background:transparent;resize:vertical;display:block}
.pback mark{color:transparent;border-radius:3px;padding:0;margin:0}
.pback .pm{background:var(--ib)}
.pback .pblank{background:#FDE68A}
.goal{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px}
.goal.won{background:var(--green-t2);border-color:#BBE5C8}
.goal-who{display:flex;gap:12px;align-items:center}.goal-who>div{display:flex;flex-direction:column;gap:2px}.goal-who strong{font-size:16px}
.gck{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--bg);font-size:14px;font-weight:600;color:var(--ink2)}
.gck i{width:20px;height:20px;border-radius:999px;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#fff}
.gck.ok{background:var(--green-t);color:var(--green-ink)}.gck.ok i{background:var(--green);border-color:var(--green)}

/* ===== hub ===== */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.hub-card{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.hub-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(22,24,29,.35)}
.hub-art{height:150px;display:flex;align-items:center;justify-content:center;gap:0;position:relative;overflow:hidden}
.hub-fig{margin:0 -8px;position:relative;border-radius:999px;box-shadow:0 0 0 4px rgba(255,255,255,.7)}.hub-fig:nth-child(2){transform:scale(1.12);z-index:5!important}
.hub-fig .fig{width:92px;height:92px;flex-basis:92px;display:block}
.hub-st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-t);color:var(--blue-ink)}
.hub-st.done{background:var(--green-t);color:var(--green-ink)}.hub-st.prog{background:var(--amber-t);color:var(--amber-ink)}
.hub-topic{align-self:flex-start;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.hub-go{margin-top:auto;padding-top:8px;color:var(--blue-d);font-weight:700}
.hub-pass{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:left}
.hub-pass strong{font-family:var(--display),sans-serif;font-size:18px}
.pillclock{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.thread{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;text-align:left;background:#fff;border:1px solid transparent}
.thread.on{background:var(--blue-t);border-color:var(--blue-b)}
.chip.ask{color:var(--blue-d);border-color:var(--blue-b)}.chip.ask.used{background:var(--bg);color:var(--mute);border-color:#EEF0F4}
.fbk{border-radius:12px;padding:12px 14px;background:var(--amber-t2);color:#3F2A0A;font-size:15px}
.fbk.ok{background:var(--green-t2);color:var(--green-ink)}
.qopt{min-height:46px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:600;text-align:left;padding:0 16px}
.qopt:hover:not(:disabled){border-color:var(--blue-b);background:var(--blue-t)}
.qopt.right{border:2px solid var(--green);background:var(--green-t2);color:var(--green-ink)}.qopt.wrongv{border:2px solid var(--amber);background:var(--amber-t2)}
.qopt:disabled:not(.right){color:var(--mute)}
/* ===== case 05 ===== */
.res{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#FCFCFD}
.stars{font-size:22px;color:#F59E0B;letter-spacing:2px}
.hlw{background:#FDE68A;border-radius:3px;padding:0 2px;color:inherit}
.bf{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:12px 20px;border-top:1px solid #F0F1F4;min-height:58px}
.bf.on{background:#FAF7FF}
.bf-l{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.bf-v{font-size:16px}.bf-v del{color:#9AA1AE;text-decoration-color:var(--red)}
.bf-v ins{text-decoration:none;background:#EDE9FE;color:#4C1D95;font-weight:600;padding:1px 6px;border-radius:5px}
.swapb{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #C4B5FD;background:#fff;color:#6D28D9;font-size:14px;font-weight:700}
.swapb:hover{background:#F5F3FF}.swapb.on{background:#6D28D9;color:#fff;border-color:#6D28D9}
.bigscore{font-family:var(--display),sans-serif;font-size:56px;font-weight:700;line-height:1;color:var(--ink)}
.bigscore.in{color:var(--green-ink)}
.bigscore[data-anim]{animation:pop .4s ease-out}
.gauge{position:relative;height:12px;border-radius:999px;background:#EEF0F4}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#7C3AED;transition:width .5s cubic-bezier(.2,.9,.3,1)}
.gauge b{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px}
.finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.finds li{display:flex;gap:10px;align-items:center;font-size:14px}
.fd{flex:0 0 46px;text-align:center;font-family:'Lexend',system-ui,sans-serif;font-weight:700;font-size:14px;padding:3px 0;border-radius:8px;background:#EEF0F4;color:var(--ink2)}
.fd.up{background:#EDE9FE;color:#5B21B6}.fd.down{background:var(--amber-t);color:var(--amber-ink)}
.sig{display:grid;grid-template-columns:170px 1fr 40px;gap:12px;align-items:center;font-size:15px}
.sigbar{height:10px;border-radius:999px;background:#F1EFF7}.sigbar i{display:block;height:100%;border-radius:999px;background:#7C3AED;min-width:3px}
.dots100{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:360px}

.seats{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;max-width:520px}

.tog{display:flex;gap:14px;align-items:center;padding:10px 8px;border-radius:12px;border:1px solid transparent;background:none;text-align:left}
.tog:hover{background:var(--bg)}
.sw{flex:0 0 44px;height:26px;border-radius:999px;background:#D5D9E0;position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.tog.on .sw{background:#7C3AED}.tog.on .sw i{left:21px}
/* ===== case 06 ===== */
.vthumb{display:block;width:100%;height:auto;border-radius:8px}
.phone{background:#fff;border:8px solid #16181D;border-radius:30px;padding:16px 14px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 30px rgba(22,24,29,.15)}
.ph-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}

.ph-vid{width:86%}
.gc{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}

.gc-av{flex:0 0 28px;width:28px;height:28px}.gc-av .fig{width:28px;height:28px;flex-basis:28px}
.gc-ini{display:flex;width:28px;height:28px;border-radius:999px;background:#E0E7FF;color:#3730A3;font-weight:700;font-size:12px;align-items:center;justify-content:center}
.gc-who{font-size:12px;font-weight:700;color:var(--mute);padding-left:4px}
.gc-b{background:var(--bg);border-radius:4px 16px 16px 16px;padding:9px 13px;font-size:15px;max-width:340px}
.gc-vid{width:280px;background:var(--bg);border-radius:14px;padding:6px}
.gc-cap{font-size:14px;padding:8px 6px 2px}.gc-meta{font-size:12px;color:var(--mute);padding:0 6px 4px}
.gc-me{align-self:flex-end;background:var(--blue);color:#fff;border-radius:16px 4px 16px 16px;padding:9px 13px;font-size:15px}
.gc-replies{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.dm{width:100%;max-width:520px;background:#fff;border:2px solid #F9A8D4;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dm-h{display:flex;gap:10px;align-items:center}
.lead{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left}
.lead:hover{background:var(--bg)}.lead.on{background:var(--blue-t);border-color:var(--blue-b)}
.lead-empty{min-height:220px;display:flex;align-items:center;justify-content:center;color:var(--mute);border:2px dashed var(--line);border-radius:12px}
.str{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.str.weak{background:#EEF0F4;color:var(--ink2)}.str.strong{background:var(--amber-t);color:var(--amber-ink)}.str.proof{background:var(--green-t);color:var(--green-ink)}
.frames{display:flex;gap:10px;flex-wrap:wrap}
.frb{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;padding:4px;border-radius:10px;border:2px solid transparent;background:none}

.frame{display:block;width:100%;height:auto;border-radius:6px}.frame.z{border-radius:10px}
.chain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}

.chain-n.src{border:2px solid var(--amber);background:var(--amber-t2)}
.chain-a{align-self:center;font-size:20px;color:var(--mute)}
.orig{border:2px solid var(--green);background:var(--green-t2);border-radius:12px;padding:12px}
.predict{display:flex;flex-direction:column;gap:8px;padding:12px 20px 14px;background:#FAF7FF;border-top:1px dashed #DDD6FE}
.pr{font-size:12px;font-weight:700;color:var(--amber-ink)}.pr.ok{color:var(--green-ink)}
.apptabs{display:flex;gap:6px;padding:12px 14px 0;border-bottom:1px solid #F0F1F4}
.apptab{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px 12px 0 0;border:1px solid transparent;border-bottom:none;background:none;margin-bottom:-1px}
.apptab.on{background:#fff;border-color:#F0F1F4;box-shadow:inset 0 3px 0 #7C3AED}
.apptab .fig{width:34px;height:34px;flex-basis:34px}
.tagrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--bg);border:2px solid transparent}
.tagrow.ok{background:var(--green-t2);border-color:#BBE5C8}.tagrow.bad{background:var(--amber-t2);border-color:var(--amber)}
.tagb{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.tagb:hover:not(:disabled){border-color:var(--blue-b);color:var(--blue-d)}.tagb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tagb:disabled{cursor:default}
.tagwhy{font-size:13px;color:var(--amber-ink);font-weight:600;line-height:1.4}
.ratio-grid{display:grid;grid-template-columns:minmax(160px,1.4fr) 80px 80px minmax(150px,1fr);gap:10px 16px;align-items:center;font-size:15px}
.rg-h{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.numin{width:92px!important;min-height:42px!important;font-family:'Lexend',system-ui,sans-serif;text-align:center}
.gauge.ok i{background:var(--green)}
.detect{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px;border-radius:12px;border:1px solid var(--line);background:#FBFCFD}
.ev{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--bg);border:2px solid transparent}
.ev.ok{background:var(--green-t2);border-color:#BBE5C8}.ev.bad{background:var(--amber-t2);border-color:var(--amber)}
.ev-t{font-weight:700;font-size:15px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.act{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px 14px 14px 16px;border-radius:12px;border:1px solid var(--line2);background:#fff}
.act:hover:not(:disabled){border-color:var(--blue-b);background:var(--blue-t)}.act.on{border:2px solid var(--blue);background:var(--blue-t)}
.act .actn{position:absolute;top:-9px;right:-9px}
.actn{display:inline-flex;width:24px;height:24px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;flex:0 0 24px}
.slot2{display:flex;gap:8px;align-items:center;min-height:40px;padding:0 12px 0 8px;border-radius:999px;border:1.5px dashed var(--line2);font-size:14px}
.slot2.on{border-style:solid;border-color:var(--blue-b);background:var(--blue-t);font-weight:600}
.slot2:not(.on) .actn{background:#D5D9E0}
.simgrid{display:grid;grid-template-columns:minmax(140px,1fr) repeat(3,minmax(90px,1fr));gap:10px 16px;align-items:center}
.minibar{height:8px;border-radius:999px;background:#EEF0F4;margin-bottom:4px}.minibar i{display:block;height:100%;border-radius:999px;background:var(--amber)}
.jo.ok{color:var(--green-ink)}.jo.mid{color:var(--blue-ink)}.jo.bad{color:var(--red-ink)}
.simnotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.simnotes li{display:flex;gap:10px;align-items:flex-start;font-size:15px}.simnotes .pill{flex:0 0 auto;font-size:12px}
.ailog{max-height:300px;overflow:auto;padding-right:2px}
.aipanel .bubble-them,.aipanel .bubble-me{font-size:14px;padding:8px 12px}
.sortdots{display:flex;align-items:center;gap:5px}.sd{width:9px;height:9px;border-radius:999px;background:#E3E6EC}.sd.done{background:var(--green)}.sd.now{background:var(--blue);transform:scale(1.3)}
.sortq{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:14px;background:#FAF7FF;border:1px solid #E9E3FB;font-size:18px;line-height:1.5}
.sortq .up{color:#5B21B6;font-weight:700}.sortq .down{color:var(--amber-ink);font-weight:700}
.sortopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.sopt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line2);background:#fff}
.sopt strong{font-size:15px}.sopt span{font-size:13px;color:var(--mute)}
.sopt:hover:not(:disabled){border-color:var(--blue-b);background:var(--blue-t)}
.sopt.right{border:2px solid var(--green);background:var(--green-t2)}.sopt.wrongv{border:2px solid var(--amber);background:var(--amber-t2)}
.sopt:disabled:not(.right){opacity:.5;cursor:default}
.finding{font-size:18px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.fgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.fgroup{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:5px solid #94A3B8}
.fgroup.proxy{border-left-color:#7C3AED}.fgroup.care{border-left-color:#EA580C}.fgroup.gender{border-left-color:#DB2777}.fgroup.fair{border-left-color:var(--green)}
.fchip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg)}
.dots100.g{grid-template-columns:repeat(10,1fr);max-width:240px;gap:5px}
.gapnum{font-family:var(--display),sans-serif;font-size:26px;font-weight:700}.gapnum .muted{font-size:15px;font-weight:500}
.guessbox{display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:240px;max-width:240px;padding:16px;border:2px dashed var(--line2);border-radius:12px}
.fairbars{display:flex;flex-direction:column;gap:12px}
.fb-row{display:grid;grid-template-columns:150px 1fr 36px;gap:12px;align-items:center;font-size:15px}
.fb-track{position:relative;height:22px;border-radius:6px;background:#F1F2F5}
.fb-zone{position:absolute;top:-4px;bottom:-4px;background:rgba(22,163,74,.16);border-left:2px dashed var(--green);border-radius:0 4px 4px 0}
.fb-bar{position:absolute;left:0;top:4px;bottom:4px;border-radius:4px;transition:width .5s}.fb-bar.rich{background:#7C3AED}.fb-bar.east{background:#EA580C}
.fb-zone-lg{background:rgba(22,163,74,.25)!important;border:1px dashed var(--green)}
/* ===== platform shell ===== */
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;flex:0 0 232px;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:#FBFAF6;border-right:1px solid var(--line);z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;padding:4px 8px 16px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--sun)}
.navlist{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:none;background:none;font-size:15px;font-weight:600;color:var(--ink2);text-align:left}
.nav:hover{background:#F0EDE4}.nav.on{background:var(--ink);color:#fff}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.me{display:flex;gap:10px;align-items:center}.me .fig{width:36px;height:36px;flex-basis:36px}.me div{display:flex;flex-direction:column}.me span{font-size:12px;color:var(--mute);font-family:'Lexend',system-ui,sans-serif}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.content>.topbar{position:sticky;top:0}
.pg{width:100%;max-width:1180px;margin:0 auto;padding:28px 32px 56px;display:flex;flex-direction:column;gap:22px}
.pg.wide{max-width:1320px}
.phead{display:flex;flex-direction:column;gap:6px}
.crumb{align-self:flex-start;border:none;background:none;padding:4px 0;color:var(--blue-d);font-weight:700;font-size:14px}
.ptitle{font-family:var(--display);font-weight:800;font-size:clamp(30px,3.6vw,40px);line-height:1.05;margin:0}
.psub{font-size:17px;color:var(--ink2);max-width:720px}
.kicker{font-family:'Lexend',system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--mute)}
.btn{border-radius:12px}
.btn-primary{background:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 #000}
.btn-primary:hover{background:#000}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn-primary:disabled{box-shadow:none}
.btn-ghost{border:1.5px solid var(--ink);color:var(--ink)}
.card{border-radius:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:60;animation:fadeUp .3s ease-out}
.iconb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:700;color:var(--ink2)}
.iconb:hover:not(:disabled){border-color:var(--ink)}.iconb:disabled{opacity:.35;cursor:default}
.stat{display:flex;flex-direction:column}.stat strong{font-family:var(--display);font-size:26px}.stat span{font-size:13px;color:var(--mute)}
/* hero + map */
.hero{display:flex;gap:24px;flex-wrap:wrap;align-items:stretch}
.nextcard{flex:0 1 430px;display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:22px;background:#fff;border:2px solid var(--ink);box-shadow:0 6px 0 var(--ink);position:relative;overflow:hidden}
.nextcard::before{content:'';position:absolute;inset:0 auto 0 0;width:118px;background:#FFF4D6;border-right:2px dashed #EADBB2}
.nc-art{position:relative;flex:0 0 96px;display:grid;place-items:center}.nc-art img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(28,30,34,.15))}
.nc-body{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.nc-tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:#EEF2FF;padding:3px 9px;border-radius:99px}
.nc-title{font-family:var(--display);font-size:22px;line-height:1.15}
.nc-sub{color:var(--ink2);font-size:14.5px;line-height:1.4}
.nc-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.nc-steps span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #D6D1C4;font-size:12px;font-weight:700;color:var(--mute);background:#fff}
.nc-steps span.on{background:var(--green);border-color:var(--green);color:#fff}.nc-steps span.now{border-color:var(--ink);background:var(--sun,#FFC845);color:var(--ink)}
.nc-steps b{font-weight:600;color:var(--mute);margin-right:6px}.nc-steps b.now{color:var(--ink)}.nc-steps em{font-style:normal;color:var(--ink2);margin-left:4px}
.nextcard .btn{align-self:flex-start;margin-top:4px}
@media (max-width:520px){.nextcard{flex-direction:column;align-items:stretch;padding-top:14px}.nextcard::before{width:auto;height:110px;inset:0 0 auto 0;border-right:none;border-bottom:2px dashed #EADBB2}.nc-art{flex-basis:96px}.nc-body{padding-top:4px}}
.map{padding:0;overflow:hidden;border:2px solid var(--ink)}
.mapsvg{display:block;width:100%;height:auto}
.mnode.un{cursor:pointer}.mnode>image{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}.mnode.un:hover>image,.mnode.un:focus-visible>image{transform:translateY(-4px) scale(1.03)}

.mnode.lock{cursor:not-allowed}
.mnode:focus{outline:none}.mnode:focus-visible ellipse{fill:var(--blue);opacity:.25}
.pin{animation:pinBob 1.8s ease-in-out infinite}
@keyframes pinBob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.mapkey{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:2px solid var(--ink);background:#fff;font-size:14px}
.kdot{display:inline-block;width:12px;height:12px;border-radius:999px;background:var(--sun);border:2px solid #E0A100;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.pin{animation:none}}
/* values */
.vchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--vt);color:var(--ink);font-size:13px;font-weight:700;border:1px solid color-mix(in srgb,var(--vc) 35%,transparent)}
.rankchip{display:inline-flex;align-items:center;gap:6px}.rankchip>b{width:22px;height:22px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:20px;border-radius:18px;background:#fff;border:1.5px solid var(--line);border-top:6px solid var(--vc);transition:transform .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(0,0,0,.3)}
.vcard strong{font-family:var(--display);font-size:22px}
.vicon{width:46px;height:46px;border-radius:14px;background:var(--vt);display:inline-flex;align-items:center;justify-content:center}.vicon.big{width:64px;height:64px;border-radius:18px;background:#fff}
.vgo{margin-top:auto;padding-top:6px;font-weight:700;color:var(--ink)}
.vhero{display:flex;gap:18px;align-items:center;padding:22px;border-radius:20px;background:var(--vt);border:2px solid var(--vc)}
.vq{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--bg);font-size:16px;font-weight:600}
.bcard{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--vc);flex-wrap:wrap}
.bnum{width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px}.bnum.sm{width:28px;height:28px;flex-basis:28px;font-size:14px;border-radius:9px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bgrid p{font-size:15px;margin-top:2px}
.bact{display:flex;gap:6px}
/* mission */
.mhero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:22px;border-radius:22px;background:#fff;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--blue-b)}
.mhero-art{display:flex}.mhero-art .fig{margin-right:-14px;width:84px;height:84px;flex-basis:84px}
.mstep{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:18px;background:#fff;border:1.5px solid var(--line);flex-wrap:wrap}
.mstep.done{border-color:#BBE5C8;background:var(--green-t2)}
.mnum{width:40px;height:40px;border-radius:999px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--display);font-size:18px;flex:0 0 40px}
.mstep.done .mnum{background:var(--green);border-color:var(--green);color:#fff}
/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.libcard{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;border-radius:20px;background:#fff;border:1.5px solid var(--line);transition:transform .15s}
.libcard:hover:not(.locked){transform:translateY(-3px)}.libcard.locked{opacity:.6}
.libart{height:140px;display:flex;align-items:center;justify-content:center;background:#1E2230}
.libart .fig{margin:0 -8px;width:78px;height:78px;flex-basis:78px}
.la1{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}.la1 span{font-family:'Lexend',system-ui,sans-serif;color:#C9D2E8;border:1px solid #3B4258;border-radius:8px;padding:6px 10px;font-size:14px}.la1 .q{color:#1E2230;background:var(--tang);border-color:var(--tang);font-weight:700}
.la2{display:grid;grid-template-columns:repeat(6,22px);gap:8px}.la2 i{width:22px;height:22px;border-radius:999px;background:#EA580C}.la2 i.h{background:#7B61FF;box-shadow:0 0 0 3px rgba(123,97,255,.3)}
.la3{display:grid;grid-template-columns:repeat(8,12px);gap:2px}.la3 i{width:12px;height:12px;background:#C9A27E;border-radius:2px}
/* lessons */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.lab{background:#161A26;color:#E8ECF7;border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:10px;min-height:520px}
.lab-k{font-family:'Lexend',system-ui,sans-serif;font-size:12px;letter-spacing:.08em;color:var(--tang)}
.lab-t{font-family:var(--display);font-size:34px;font-weight:800;margin:0;color:#fff}
.lab-p{color:#B8C0D6;font-size:16px;max-width:620px}
.lab-stage{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;padding:18px 0}
.lab-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#9AA3BC;border-top:1px solid #2A3042;padding-top:12px;align-items:center}
.lab-sub{display:block;font-family:'Lexend',system-ui,sans-serif;font-size:12px;color:#9AA3BC;margin-bottom:8px}
.lgd{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}.lgd.o{background:var(--tang)}.lgd.b{background:#6E8BFF}.lgd.w{background:#7B61FF}.lgd.e{background:#EA580C}
.lside{display:flex;flex-direction:column;gap:14px}
.lsteps{display:contents}.lsteps-w{display:flex;flex-wrap:wrap;gap:6px}
.lstep{display:flex;flex-direction:column;gap:6px;border:none;background:none;padding:0;font-size:12px;font-weight:600;color:var(--mute);text-align:left}
.lstep i{height:4px;border-radius:2px;background:#E3DED2}.lstep.done i{background:var(--ink)}.lstep.now i{background:var(--tang)}.lstep.now{color:var(--ink)}
.lstep:disabled{cursor:default}
.lcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px}
.btn-lab{background:var(--tang);color:#1E2230;border-color:var(--tang);box-shadow:0 3px 0 #B8571A}
.btn-lab:disabled{background:#3B4258;color:#8B93AA;border-color:#3B4258;box-shadow:none}
.nw-sent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:19px}
.tokw{font-family:'Lexend',system-ui,sans-serif;border:1px solid #3B4258;border-radius:8px;padding:6px 10px;background:#1E2333}
.tokw.pick{background:var(--tang);color:#1E2230;border-color:var(--tang);font-weight:700;min-width:44px;text-align:center}.tokw.pick[data-empty]{background:transparent;color:var(--tang);border-style:dashed}
.nw-bars,.wbars{display:flex;flex-direction:column;gap:10px}
.nwb,.wb{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;font-size:15px}
.nwb-w{font-family:'Lexend',system-ui,sans-serif}
.nwb-t{height:14px;border-radius:7px;background:#262C3D;overflow:hidden}.nwb-t i{display:block;height:100%;background:#6E8BFF;border-radius:7px;transition:width .25s}
.nwb.hit .nwb-t i{background:var(--tang)}.nwb.hit .nwb-w{color:var(--tang);font-weight:700}
.nwb b,.wb b{font-family:'Lexend',system-ui,sans-serif;font-size:13px;text-align:right}
.wb.flag .nwb-t i{background:var(--tang)}
.nw-ctrl{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tslide{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#B8C0D6;flex:1;max-width:280px}.tslide b{color:#fff}
.tslide input{accent-color:var(--tang);width:100%}
.nw-runs{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:#9AA3BC;min-height:28px}
.runchip{font-family:'Lexend',system-ui,sans-serif;background:#262C3D;border-radius:6px;padding:3px 8px;color:#E8ECF7}
.meterline{display:flex;justify-content:space-between;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.l2wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.past{display:grid;grid-template-columns:repeat(6,34px);gap:8px}
.pp{position:relative;width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;opacity:.55}
.pp.w{background:#7B61FF}.pp.e{background:#EA580C}.pp.h{opacity:1}
.pp b{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:999px;background:#fff;color:#11573B;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.tpair{display:flex;gap:14px;flex-wrap:wrap}
.tp{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;background:#1E2333;border:1px solid #3B4258}
.tps{font-family:var(--display);font-size:38px;color:var(--tang)}
.l3wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.facebox{width:280px;height:280px;border-radius:16px;overflow:hidden;border:2px solid #3B4258;flex:0 0 auto}
.facesvg{display:block;width:100%;height:100%}
.stepdots{display:flex;gap:6px}.stepdots i{flex:1;height:6px;border-radius:3px;background:#262C3D}.stepdots i.on{background:var(--tang)}
.chip.labchip{background:#1E2333;border-color:#3B4258;color:#E8ECF7}.chip.labchip.on{background:var(--tang);color:#1E2230;border-color:var(--tang)}
.profile{background:#fff;color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:440px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pgrid div{border-radius:8px;overflow:hidden;aspect-ratio:1}.pgrid svg{width:100%;height:100%}
/* reflect */

function novaReply(q){
  const x=q.toLowerCase();
  if(/source|where did you|where do you|how do you know|link|cite|citation|reference|proof|evidence/.test(x))return{k:'sources'};
  if(/sure|really|true|certain|correct|accurate/.test(x))return{text:'Yes, I’m confident. This is well documented.'};
  if(/quote|say|said|words|speech|memorable|motto/.test(x))return{k:'quote'};
  if(/book|read more|learn more|biograph|article|where can/.test(x))return{k:'source'};
  if(/elect|mayor|when|year|won|vote|became|first|date|1971/.test(x))return{k:'election'};
  if(/known|famous|achiev|background|job|teacher|library|before|career|life|did she do|who (is|was)/.test(x))return{k:'known'};
  if(/^(hi|hey|hello|thanks|thank you|ok|cool)/.test(x))return{text:'Happy to help with the Delgado profile! What would you like to know?'};
  return{text:'Good question. I can tell you about her election, what she’s known for, something she said, or where to read more.'};

  if(needVals){const nv=S.board.length;return `<div class="nextcard"><div class="nc-art"><img src="assets/camp.webp" alt=""></div><div class="nc-body"><span class="nc-tag">Up next · Values Camp</span><strong class="nc-title">Choose your values</strong><span class="nc-sub">Save 3 values to unlock your first mission.</span>
    <div class="nc-steps">${[0,1,2].map(i=>`<span class="${i<nv?'on':''}">${i<nv?'✓':i+1}</span>`).join('')}<em>${nv} of 3 saved</em></div><button class="btn btn-primary" data-act="go" data-arg="values">Explore values →</button></div></div>`}
  if(!cur)return `<div class="nextcard"><div class="nc-art"><img src="assets/b_trophy.webp" alt=""></div><div class="nc-body"><span class="nc-tag">All done</span><strong class="nc-title">Every mission complete</strong><span class="nc-sub">Revisit any mission, or look back at how your values changed.</span><button class="btn btn-primary" data-act="go" data-arg="journey">See my journey →</button></div></div>`;
  const st=MS(cur.n);const ps=parts(cur.n);const i=ps.findIndex(p=>!p[1]);
  const step=[{s:`Lesson: ${cur.lname}. ${cur.lsub}.`,b:'Start lesson',a:cur.lesson},{s:CASES[cur.case].blurb,b:S.started[cur.case]?'Continue case':'Open case',a:'case:'+cur.case},{s:'Which values mattered? Did anything change?',b:'Reflect',a:'reflect/'+cur.n}][i<0?2:i];
  return `<div class="nextcard"><div class="nc-art"><img src="assets/${LAND_IMG[cur.n-1]}.webp" alt=""></div><div class="nc-body"><span class="nc-tag">Up next · Mission ${cur.n}</span><strong class="nc-title">${cur.title}</strong>
    <div class="nc-steps">${ps.map((p,j)=>`<span class="${p[1]?'on':j===i?'now':''}" title="${p[0]}">${p[1]?'✓':j+1}</span><b class="${j===i?'now':''}">${p[0]}</b>`).join('')}</div>
    <span class="nc-sub">${step.s}</span><button class="btn btn-primary" data-act="goTo" data-arg="${step.a}">${step.b} →</button></div></div>`}
function curMission(){return S.board.length<3&&!S.campDone&&!S.unlockAll?null:MISSIONS.find(m=>msUnlocked(m.n)&&!MS(m.n).reflect)}
function mapSVG(){
  const curM=curMission();const startDone=S.board.length>=3||!!S.campDone;
  const P=[[110,150],[390,100],[670,160],[950,100]];
  const path=`M${P[0][0]} ${P[0][1]} C 230 70, 280 90, ${P[1][0]} ${P[1][1]} S 560 180, ${P[2][0]} ${P[2][1]} S 860 70, ${P[3][0]} ${P[3][1]}`;
  const reached=startDone?MISSIONS.filter(m=>MS(m.n).reflect).length:-1;
  const pin=(x,y)=>`<g class="pin" transform="translate(${x} ${y})"><circle r="20" fill="#fff" stroke="#3355E0" stroke-width="3"/><image href="assets/ch_you.webp" x="-17" y="-17" width="34" height="34"/><path d="M-5 19l5 8 5-8z" fill="#3355E0"/></g>`;
  const stop=({x,y,img,title,sub,un,done,here,act,arg,aria,parts})=>`<g class="mnode ${un?'un':'lock'} ${done?'done':''} ${here?'here':''}" data-act="${act}" data-arg="${arg}" role="button" tabindex="0" aria-label="${aria}">
      <circle cx="${x}" cy="${y}" r="58" fill="${done?'#E8F6EE':here?'#FFF6DA':'#fff'}" stroke="${here?'#1C1E22':done?'#2BB58A':'#E3DED2'}" stroke-width="${here?3:2}"/>
      <image href="assets/${img}.webp" x="${x-44}" y="${y-44}" width="88" height="88" ${un?'':'filter="url(#gs)" opacity=".45"'}/>
      ${done?`<g transform="translate(${x+42} ${y-42})"><circle r="13" fill="#2BB58A"/><path d="M-5 0l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`:''}
      <text x="${x}" y="${y+84}" text-anchor="middle" font-size="15" font-weight="700" fill="${un?'#1C1E22':'#9AA0AE'}" font-family="Lexend,sans-serif">${title}</text>
      ${sub?`<text x="${x}" y="${y+104}" text-anchor="middle" font-size="12.5" fill="#8A90A0" font-family="Lexend,sans-serif">${sub}</text>`:''}
      ${parts!=null?`<g transform="translate(${x-16} ${y+122})">${[0,1,2].map(j=>`<circle cx="${j*16}" cy="0" r="5" fill="${j<parts?'#1C1E22':'#E3DED2'}"/>`).join('')}</g>`:''}
      ${here?pin(x+48,y-60):''}</g>`;
  const nodes=[stop({x:P[0][0],y:P[0][1],img:'camp',title:'Values Camp',sub:startDone?'Done':'Start here',un:true,done:startDone,here:!startDone,act:'go',arg:'values',aria:'Values Camp',parts:null})]
    .concat(MISSIONS.map((m,i)=>{const un=msUnlocked(m.n);return stop({x:P[i+1][0],y:P[i+1][1],img:LAND_IMG[i],title:m.title,sub:un?'Mission '+m.n:'Mission '+m.n+' · locked',un,done:MS(m.n).reflect,here:curM&&curM.n===m.n,act:un?'go':'lockedMsg',arg:un?'mission/'+m.n:m.n,aria:`Mission ${m.n}: ${m.title}${un?'':' (locked)'}`,parts:msParts(m.n)})}));
  return `<section class="map card" aria-label="Mission map"><div class="mapscroll" id="mapscroll">
    <svg viewBox="0 0 1060 300" class="mapsvg" role="img" aria-label="Map of missions">
      <defs><filter id="gs"><feColorMatrix type="saturate" values="0"/></filter></defs>
      <rect width="1060" height="300" fill="#FBF8F1"/>
      <path d="${path}" fill="none" stroke="#E6DFCF" stroke-width="10" stroke-linecap="round"/>

  </section>`}
const LAND_IMG=ART2?['lm1','lm2','lm3']:['newsroom','jobs','school'];
const LAND=LAND_IMG.map(k=>(x,y,un)=>`<image href="assets/${k}.webp" x="${x-78}" y="${y-118}" width="156" height="156" preserveAspectRatio="xMidYMax meet" ${un?'':'filter="url(#gs)" opacity=".55"'}/>`);
ACT.goTo=a=>{if(a.startsWith('case:'))openCaseStart(a.slice(5));else go(a)};
function openCaseStart(k){const C=CASES[k];S.case=k;S.started[k]=true;if(S.done[k]){if(C.reset)C.reset();S.done[k]=false;S.last[k]=null}go(S.last[k]?S.last[k]:C.screens[0])}

/* ---------- VALUES STUDIO ---------- */

    <div class="row" style="justify-content:space-between;align-items:center;gap:10px"><span class="muted">${S.board.length} of 5 saved${S.board.length<3?' · 3 unlock Mission 1':''}</span><button class="linkbtn" data-act="go" data-arg="guide">See my board</button></div>
    <div class="vgrid">${VORDER.map(k=>{const V=VALUES[k];return `<button class="vcard" style="--vc:${V.c};--vt:${V.t}" data-act="go" data-arg="value/${k}"><span class="vicon">${vIcon(k,24)}</span><strong>${V.name}</strong><span class="muted">${V.mean}</span><span class="vgo">${onB(k)?'✓ On your board':'Explore →'}</span></button>`}).join('')}</div>
  </main>`}
function value(){
  const k=S.param;const V=VALUES[k];if(!V)return values();const ex=S.board.find(b=>b.k===k)||{};const D=S.vdraft[k]||(S.vdraft[k]={me:ex.me||'',ai:ex.ai||'',q:''});
  const full=S.board.length>=5&&!ex.k;
  return `<main class="pg">${pageHead('','',['values','Values Studio'])}
    <section class="vhero" style="--vc:${V.c};--vt:${V.t}"><span class="vicon big">${vIcon(k,30)}</span><div><h1 class="ptitle">${V.name}</h1><p class="psub">${V.mean}</p></div></section>
    <div class="row" style="gap:18px;align-items:flex-start">
      <section class="card stack" style="flex:1 1 280px;gap:14px"><h2 style="font-size:19px">With AI, it might look like…</h2><p style="font-size:16px">${V.ai}</p>
        <div class="vq"><span class="kicker">THINK ABOUT IT</span><span>${V.q}</span></div></section>
      <section class="card stack" style="flex:999 1 380px;gap:12px">
        <label for="vme" style="font-weight:700">What does ${V.name.toLowerCase()} mean to you?</label>
        <textarea id="vme" rows="2" data-input="v:${k}:me" placeholder="To me, ${V.name.toLowerCase()} means…">${esc(D.me)}</textarea>
        <label for="vai" style="font-weight:700">How will it guide your AI use?</label>
        <textarea id="vai" rows="2" data-input="v:${k}:ai" placeholder="When I use AI, I will…">${esc(D.ai)}</textarea>
        ${S.vwarn===k?'<span class="xwarn" style="color:var(--amber-ink);font-weight:600;font-size:14px">Write a few words in both boxes first.</span>':''}
        ${full?'<span class="muted" style="font-size:14px">Your board is full (5). Remove a value to add this one.</span>':''}
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px"><button class="btn btn-ghost" data-act="go" data-arg="values">Back</button><button class="btn btn-primary" data-act="saveValue" data-arg="${k}" ${full?'disabled':''}>${ex.k?'Update on my board':'Save to my board'}</button></div>
      </section>
    </div>
  </main>`}
ACT.saveValue=k=>{const D=S.vdraft[k];if(!D||D.me.trim().length<3||D.ai.trim().length<3){S.vwarn=k;render();return}S.vwarn=null;
  const ex=S.board.find(b=>b.k===k);if(ex){ex.me=D.me.trim();ex.ai=D.ai.trim()}else if(S.board.length<5){S.board.push({k,me:D.me.trim(),ai:D.ai.trim()});S.cred+=5}
  if(!ex&&S.board.length>=3&&!S.campDone){S.campDone=true;S.modal={icon:'⛺',kicker:'Values Camp complete · +15 XP',title:'Mission 1 unlocked',body:'Your values are saved. After each case you’ll test them against a real decision.',cta:['Start Mission 1','mission/1'],sec:['Add more values','values']};go('home');return}
  S.toast=ex?`${VALUES[k].name} updated`:`${VALUES[k].name} saved to your board`;go(ex?'guide':'values')};
function guide(){
  const B=S.board;
  return `<main class="pg">${pageHead('My Guide','Your values, in order. They can change as you learn.')}<div class="show-sm" style="margin-top:-10px"><button class="linkbtn" data-act="go" data-arg="settings">Settings</button></div>
    <section class="stack" style="gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 style="font-size:22px">My values board</h2><span class="muted">${B.length} of 5 · most important first</span></div>
      ${B.length?B.map((b,i)=>{const V=VALUES[b.k];return `<div class="bcard" style="--vc:${V.c};--vt:${V.t}"><div class="bnum">${i+1}</div><div class="stack" style="flex:1;gap:8px;min-width:0"><div class="row" style="gap:10px;align-items:center">${vChip(b.k)}${b.updated?'<span class="tag" style="background:var(--green-t);color:var(--green-ink)">Updated after a mission</span>':''}</div>
        <div class="bgrid"><div><span class="kicker">WHAT IT MEANS TO ME</span><p>${esc(b.me||'—')}</p></div><div><span class="kicker">HOW I WANT TO USE AI</span><p>${esc(b.ai||'—')}</p></div></div></div>
        <div class="bact"><button class="iconb" data-act="moveV" data-arg="${i}|-1" ${i===0?'disabled':''} aria-label="Move ${V.name} up">↑</button><button class="iconb" data-act="moveV" data-arg="${i}|1" ${i===B.length-1?'disabled':''} aria-label="Move ${V.name} down">↓</button><button class="iconb" data-act="go" data-arg="value/${b.k}" aria-label="Edit ${V.name}">✎</button><button class="iconb" data-act="removeV" data-arg="${i}" aria-label="Remove ${V.name}">✕</button></div></div>`}).join(''):`<div class="card muted">No values yet. <button class="linkbtn" data-act="go" data-arg="values">Explore values</button></div>`}

    </section>
    <section class="stack" style="gap:12px"><h2 style="font-size:22px">My reflections</h2>
      ${S.reflections.length?S.reflections.slice().reverse().map(r=>`<div class="card stack" style="gap:8px"><div class="row" style="justify-content:space-between;gap:8px"><strong>Mission ${r.n}: ${MISSIONS[r.n-1].title}</strong><span class="muted" style="font-size:13px">${r.date}</span></div>
        <div class="row" style="gap:6px">${r.rank.map((k,i)=>`<span class="rankchip"><b>${i+1}</b>${vChip(k)}</span>`).join('')}</div>
        ${r.hard?`<p><span class="muted">Hardest part:</span> ${esc(r.hard)}</p>`:''}${r.feel?`<p><span class="muted">Feeling:</span> ${esc(r.feel)}</p>`:''}</div>`).join(''):'<div class="card muted">Finish a mission to save your first reflection.</div>'}
    </section>
  </main>`}
ACT.moveV=arg=>{const [i,d]=arg.split('|').map(Number);const B=S.board;const j=i+d;if(j<0||j>=B.length)return;[B[i],B[j]]=[B[j],B[i]];render()};
ACT.removeV=i=>{const v=S.board.splice(+i,1)[0];if(v){S.toast=VALUES[v.k].name+' removed from your board';delete S.vdraft[v.k]}render()};

  return `<main class="pg">${pageHead('','',['home','Map'])}

    ${!un?`<div class="card fbk">Locked. ${m.n===1?'Save at least 3 values in the Values Studio first.':'Finish Mission '+(m.n-1)+' to unlock this one.'}</div>`:''}
    <section class="stack" style="gap:12px">
      ${step(1,'Lesson · '+m.lname,'About 8 min',st.lesson,m.lesson,'Start lesson',!un?'Locked':'')}
      ${step(2,'Case · '+m.title,'About 20 min',st.case,'case:'+m.case,S.started[m.case]&&!st.case?'Continue':'Open case',!un?'Locked':'')}
      ${step(3,'Reflect','About 5 min',st.reflect,'reflect/'+m.n,'Reflect',!un?'Locked':!st.case?'After the case':'')}
    </section>
    
  </main>`}

/* ---------- REFLECT ---------- */
function reflect(){
  const m=MISSIONS[(+S.param||1)-1];const R=S.rf[m.n]||(S.rf[m.n]={step:0,picked:[],why:'',tension:'',rank:null,hard:'',feel:null,revisit:null,me:'',ai:'',applied:false});
  if(!MS(m.n).case&&!S.unlockAll)return `<main class="pg">${pageHead('Reflect',`Finish the case first, then come back.`,['mission/'+m.n,'Mission '+m.n])}<div><button class="btn btn-primary" data-act="goTo" data-arg="case:${m.case}">Open the case →</button></div></main>`;
  const steps=['Identify','Tension','Rank','Reflect'];
  const head=`<div class="rsteps">${steps.map((s,i)=>`<span class="rs ${i<R.step?'done':i===R.step?'now':''}"><b>${i<R.step?'✓':i+1}</b>${s}</span>`).join('')}</div>`;
  let body='';
  if(R.step===0){body=`<h2 class="rtitle">Which values mattered in this case?</h2><p class="muted">Pick any. There’s no right answer.</p>

/* labels: sentence case instead of SHOUTY CAPS */
function scase(t){if(!/[A-Z]{2}/.test(t)||t!==t.toUpperCase())return t;let o=t.toLowerCase().replace(/(^\s*|[·:•]\s*)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  return o.replace(/\bai\b/gi,'AI').replace(/\bi\b/g,'I').replace(/\bu\.s\./g,'U.S.').replace(/\btake it down\b/gi,'TAKE IT DOWN').replace(/\bnova\b/g,'Nova').replace(/\bjordan\b/g,'Jordan').replace(/\bmay\b/g,'May')}
function sentenceLabels(){document.querySelectorAll('.kicker,.eyebrow,.lab-k,.nc-tag,.lab-sub,.rg-h').forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const v=scase(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}})}

/* ----- L3: Picture from noise · how AI makes images ----- */
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rnd(i){const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
function sceneColor(x,y,o,seed){
  const night=o.night,snow=o.snow;const hx=seed%2?16:6;const sx=seed%3===0?6:seed%3===1?16:26;const tx=hx>10?5:26;
  const roofCol=snow?'#F4F7FB':'#6B3A1F';
  if(Math.hypot(x-sx,y-5)<3.2)return night?'#F4F1DE':'#FFC845';
  if(o.tree){if(Math.hypot(x-tx,y-15)<4.2&&y<19)return snow?'#E8F0F4':'#2E8B57';if(x>=tx&&x<=tx+1&&y>=18&&y<25)return '#8A5A2B'}
  if(y>=10&&y<16&&Math.abs(x-(hx+5.5))<=(y-9)*1.05)return roofCol;
  if(x>=hx&&x<=hx+11&&y>=16&&y<25){if(x>=hx+2&&x<=hx+4&&y>=20)return '#4A2A14';if(x>=hx+7&&x<=hx+9&&y>=18&&y<=20)return night?'#FFE38A':'#DCEBFF';return o.blue?'#3D7BF0':'#E0484F'}
  if(y>=25)return snow?'#F2F5FA':night?'#2F6B3A':'#5DBB63';
  if(snow&&!night&&((x*7+y*13+seed)%23===0))return '#FFFFFF';
  return night?(y<10?'#141C36':'#1E2A4A'):(y<10?'#8EC3F2':'#B5D8F7')}
function sceneSVG(o,t,seed,size){const N=32;let r='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x+seed*1301;const tgt=hexRgb(sceneColor(x,y,o,seed));const nz=[rnd(i)*255,rnd(i+999)*255,rnd(i+4242)*255];const tt=Math.min(1,Math.max(0,t*1.15-rnd(i+77)*0.15));
  const c=tgt.map((v,j)=>Math.round(nz[j]*(1-tt)+v*tt));r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="rgb(${c.join(',')})"/>`}
  return `<svg viewBox="0 0 32 32" width="${size||300}" height="${size||300}" shape-rendering="crispEdges" class="facesvg" role="img" aria-label="Generated picture, ${Math.round(t*100)}% denoised">${r}</svg>`}
function l3(){const id='l3';const L=LS(id);if(L.v!==2){Object.keys(L).forEach(k=>delete L[k]);L.v=2;L.step=0;L.max=0}if(L.t==null){L.t=0;L.seed=1;L.o={night:false,blue:false,tree:false,snow:false};L.seeds=[]}
  const stepN=Math.round(L.t*10);
  const chips=[['night','at night'],['blue','a blue house'],['tree','with a tree'],['snow','in the snow']];
  const prompt='a little house'+(L.o.blue?' (blue)':'')+(L.o.tree?', with a tree':'')+(L.o.snow?', in the snow':'')+(L.o.night?', at night':'');
  const stage=`<div class="l3wrap"><div class="facebox">${sceneSVG(L.o,L.t,L.seed,280)}</div>
      <div class="stack" style="gap:14px;flex:1;min-width:220px"><div class="nw-sent" style="font-size:15px"><span style="opacity:.7">Prompt:</span>&nbsp;<span class="tokw">${prompt}</span></div>
        <label class="tslide" style="max-width:none"><span>Cleanup step <b>${stepN} / 10</b></span><input type="range" min="0" max="10" step="1" value="${stepN}" data-input="l3t" aria-label="Cleanup step"></label>
        <div class="stepdots">${Array.from({length:11},(_,i)=>`<i class="${i<=stepN?'on':''}"></i>`).join('')}</div>
        ${L.step>=2?`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start">${chips.map(c=>`<button class="chip labchip ${L.o[c[0]]?'on':''}" data-act="l3Opt" data-arg="${c[0]}">${L.o[c[0]]?'✓ ':'+ '}${c[1]}</button>`).join('')}</div>`:''}
        ${L.step>=3?`<button class="btn btn-lab" style="align-self:flex-start" data-act="l3Seed">New noise, same prompt</button>`:''}</div></div>
      ${L.seeds.length?`<div><span class="lab-sub">Same prompt, different starting noise</span><div style="display:flex;gap:8px;flex-wrap:wrap">${L.seeds.map(s=>`<div class="seedthumb">${sceneSVG(L.o,1,s,72)}</div>`).join('')}</div></div>`:''}`;
  let side='';
  if(L.step===0)side=qcard(id,'guess',['GUESS FIRST','How does an image AI make a picture that never existed?'],['It finds a photo online and edits it','It cuts and pastes pieces of photos','It starts with random noise and cleans it up, step by step'],2,['Not quite. No single photo is used. Try the slider.','Not quite. Nothing is pasted. Try the slider.','Yes. Drag the slider and watch.'])+(L.guess!=null?nextBtn(id,'Next: try it'):'');
  else if(L.step===1)side=`<div class="lcard stack" style="gap:10px"><span class="kicker">TRY IT</span><strong style="font-size:18px">Drag the slider from 0 to 10.</strong><span class="muted">At each step, the AI guesses which dots are noise and removes a little.</span></div>${stepN>=10?`<div class="fbk ok fade-in">A picture from pure static. It learned what houses, skies and trees look like from millions of images.</div>${nextBtn(id,'Next: steer it')}`:''}`;
  else if(L.step===2)side=`<div class="lcard stack" style="gap:10px"><span class="kicker">STEER IT</span><strong style="font-size:18px">Add words to the prompt.</strong><span class="muted">Every word changes what the cleanup aims for.</span></div>`+(L.changed>=2?qcard(id,'why',['SAY WHY','How does it know what “snow” looks like?'],['Someone drew snow for it','It learned from millions of pictures people posted online','It checks the weather'],1,['No one drew anything. It learned from examples.','Yes. Mostly pictures posted online, often without the people in them being asked.','It doesn’t check anything. It learned patterns during training.'])+(L.why===1?nextBtn(id,'Next: break it'):''):'<span class="muted" style="font-size:13px">Add at least two words.</span>');
  else side=`<div class="lcard stack" style="gap:10px"><span class="kicker">BREAK IT</span><strong style="font-size:18px">Press “New noise” three times.</strong><span class="muted">Same prompt. Watch what changes.</span></div>`+(L.seeds.length>=3?qcard(id,'few',['SAY WHY','Why is every picture a little different?'],['The AI gets bored','Each one starts from different random noise','It’s copying different photos'],1,['It doesn’t get bored. The starting point changes.','Yes. New noise, new picture. That’s why AI images can look real but never come from one real moment.','No copying. Each picture is built fresh from noise.'])+(L.few===1?finishBtn(id):''):'');
  return lessonFrame(id,{kicker:'HOW AI MAKES IMAGES',where:'Image generator · noise to picture',title:'Picture from noise',intro:'Image AI doesn’t copy photos. It starts from static and removes noise, step by step, steered by your words.',stage,side,steps:['Guess','Try it','Steer it','Break it'],
    legend:'<span style="opacity:.7">A simplified picture of how image AI (called diffusion) works</span>',
    deeper:'During training, the AI watched millions of real pictures get buried in noise, and learned to undo it. To make something new, it starts from fresh noise and runs that cleanup backwards, guided by the words in your prompt. The same trick works for video and voices.'})}

const LIVE_RULES='You are playing a character in White Box, a classroom simulation where 10th graders practice AI ethics. Everything in it is fictional. Stay in character. Reply in 1 to 3 short sentences of plain text: no lists, no markdown, no emoji unless the character texts that way. Use only the facts below. If you would not know something, say so in character instead of inventing it. Never tell the student which decision to make or what the right answer is; help them think and point them to evidence. Keep it school-appropriate. If they go off-topic, answer briefly and bring it back to the case.';
function caseLine(){const C=CASES[S.case]||{};return `Case: ${C.title||''} (${C.topic||''}). ${C.blurb||''}`}
function ownBubbles(list,fb){return (list||[]).map(t=>{const o=typeof t==='string'?{q:t,a:fb}:t;return `<div class="bubble-me">${esc(o.q)}</div>`+(o.pending?'<div class="bubble-them"><span class="dots"><i></i><i></i><i></i></span></div>':`<div class="bubble-them">${esc(o.a||fb)}</div>`)}).join('')}
function personPrompt(p,asked,own,q){
  const facts=p.qa.map(x=>`- Asked "${x[0]}" you said: "${x[1]}"`).join('\n');
  const hist=[`${p.name}: ${p.open}`].concat(asked.map(x=>`Student: ${x[0]}\n${p.name}: ${x[1]}`)).concat((own||[]).filter(o=>typeof o!=='string'&&o.a).map(o=>`Student: ${o.q}\n${p.name}: ${o.a}`)).join('\n');
  return `${LIVE_RULES}\n\nYou are ${p.name}, ${p.role}. ${caseLine()}\n\nWhat you know and have said:\n${facts}\n\nConversation so far:\n${hist}\n\nStudent: ${q}\n\nReply as ${p.name} only.`}
async function liveRun(entry,prompt,fb){

function liveAskPerson(D,ctx,q){const p=ctx.p;D.own=D.own||{};const list=(D.own[D.who]=D.own[D.who]||[]);

ACT.bApp=a=>{S.b.app=a;S.b.pending=null;render()};
ACT.bSwap=k=>{const B=S.b;const app=B.app;const id=app+':'+k;
  if(B.swap[app]===k){B.swap[app]=null;B.lastSwap=null;render();return}
  if(B.finds[id]){B.swap[app]=k;B.lastSwap=k;render();B.lastSwap=null;return}
  B.pending=B.pending===id?null:id;render()};
ACT.bPredict=p=>{const B=S.b;const [app,k]=B.pending.split(':');const x=B_APPS[app].fields.find(f=>f.k===k);
  const real=x.d>2?'up':x.d<-2?'down':'same';const ok=p===real;B.finds[B.pending]={p,ok};B.lastFind=B.pending;if(ok)S.cred+=5;
  B.swap[app]=k;B.lastSwap=k;B.pending=null;render();B.lastFind=null;B.lastSwap=null};
ACT.bReport=()=>{S.b.stage='report';S.b.sortIdx=0;render();setTimeout(()=>{const el=document.getElementById('breport');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},50)};
ACT.bTag=arg=>{const [k,c]=arg.split('|');const B=S.b;const cat=B_APPS[k.split(':')[0]].fields.find(f=>f.k===k.split(':')[1]).cat;if(!B.tags[k]&&c===cat)S.cred+=3;B.tags[k]=c;render()};
ACT.bNextSort=()=>{const B=S.b;B.sortIdx=(B.sortIdx||0)+1;render();const el=document.getElementById('breport');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
ACT.bToGap=()=>{S.b.stage='ratio';render();setTimeout(()=>{const el=document.getElementById('bratio');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},50)};
ACT.bGuess=g=>{const B=S.b;B.guess=g;B.stage='done';if(!B.gapCred){B.gapCred=true;S.cred+=10}render()};

  {k:'school',label:'School name',hint:'Which school they go to'},
  {k:'sports',label:'Team sports',hint:'Club and varsity teams'},
  {k:'commute',label:'Commute time',hint:'How far they live from job sites'},
